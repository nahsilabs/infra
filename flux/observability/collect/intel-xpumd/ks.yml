apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obs-intel-xpumd
  namespace: flux-system
spec:
  path: ./flux/observability/collect/intel-xpumd/app
  targetNamespace: obs-collect
  prune: true
  dependsOn:
    - name: infra-vm-operator
    - name: infra-intel-device-plugins-gpu
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obs-intel-xpumd-dashboard
  namespace: flux-system
spec:
  path: ./flux/observability/collect/intel-xpumd/obs
  targetNamespace: obs-collect
  prune: true
  dependsOn:
    - name: infra-grafana-operator
    - name: obs-grafana
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
