apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
    namespace: flux-system
  values:
    fullnameOverride: kube-state-metrics
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 320Mi

    prometheus:
      monitor:
        enabled: true
        honorLabels: true
        additionalLabels:
          obs.nahsilabs/metrics: "true"
