apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-bazarr
  namespace: flux-system
spec:
  path: ./flux/apps/arr/bazarr/app
  targetNamespace: arr
  prune: true
  wait: true
  dependsOn:
    - name: infra-gateway-private
    - name: infra-ceph-csi-rbd
    - name: infra-csi-driver-nfs
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
