---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-comfyui
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-gateway-api-crds
  path: ./flux/apps/comfyui/app
  targetNamespace: comfyui
  prune: true
  ignore:
    - paths:
        - /spec/values/controllers/main/replicas
      target:
        kind: HelmRelease
        name: comfyui
        namespace: comfyui
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
