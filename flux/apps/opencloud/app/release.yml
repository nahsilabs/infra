apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencloud
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: opencloudeu/opencloud-rolling
              tag: 7.5.0@sha256:6db1cfb06d430a663f16e9f33dcd4596d82a4875be0b4df233c26ce5f667ea74
            command: ["/bin/sh"]
            args: ["-c", "opencloud init || true; exec opencloud server"]
            envFrom:
              - secretRef:
                  name: opencloud
              - secretRef:
                  name: opencloud-oidc
              - secretRef:
                  name: opencloud-s3
            env:
              TZ: Europe/Athens
              OC_CONFIG_DIR: /var/lib/opencloud/config
              OC_URL: https://opencloud.nahsi.dev
              OC_LOG_LEVEL: info
              OC_LOG_COLOR: "false"
              OC_LOG_PRETTY: "false"
              OC_INSECURE: "false"
              PROXY_TLS: "false"
              PROXY_ENABLE_BASIC_AUTH: "false"
              PROXY_ENABLE_APP_AUTH: "true"
              PROXY_DEBUG_ADDR: 0.0.0.0:9205
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
              IDM_CREATE_DEMO_USERS: "false"
              FRONTEND_CHECK_FOR_UPDATES: "false"
              OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: "true"
              OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD: "true"
            probes:
              startup:
                enabled: true
                type: HTTP
                path: /health
                port: 9200
                spec:
                  periodSeconds: 2
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 9200
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 9200
                spec:
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              runAsNonRoot: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      main:
        controller: main
        ports:
          http:
            port: 9200
          metrics:
            port: 9205

    serviceMonitor:
      main:
        enabled: true
        labels:
          obs.nahsilabs/metrics: "true"
        endpoints:
          - port: metrics
            path: /metrics

    persistence:
      state:
        size: 30Gi
        storageClass: ceph-rbd-retain
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /var/lib/opencloud
      csp:
        type: configMap
        name: opencloud-csp
        globalMounts:
          - path: /etc/opencloud/csp.yaml
            subPath: csp.yaml
            readOnly: true

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Productivity
          gethomepage.dev/name: OpenCloud
          gethomepage.dev/icon: open-cloud.svg
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=opencloud"
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
          - name: public-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - opencloud.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: http
                weight: 1
