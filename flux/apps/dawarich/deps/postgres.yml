apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-dawarich
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:c9be7f221a05b18fe65259d9136affbabe3b39ad91c3b68f8f2f990a45f35f38
  primaryUpdateStrategy: unsupervised
  postgresql:
    extensions:
      - name: postgis
        image:
          reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.2-18-trixie@sha256:93584892e25a57e47e988b0f80ad9988035d1396d4a87824307eddf2242348c8
        ld_library_path:
          - system
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: ceph-rbd-retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: app
spec:
  cluster:
    name: pg-dawarich
  name: app
  owner: app
  extensions:
    - name: postgis
      ensure: present
