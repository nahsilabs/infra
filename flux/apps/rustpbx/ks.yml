---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-rustpbx-deps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cloudnative-pg
    - name: infra-cert-manager
    - name: infra-cert-issuers
  path: ./flux/apps/rustpbx/deps
  targetNamespace: rustpbx
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-rustpbx
  namespace: flux-system
spec:
  dependsOn:
    - name: app-rustpbx-deps
    - name: infra-bgp
  path: ./flux/apps/rustpbx/app
  targetNamespace: rustpbx
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
