apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-langfuse
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      timezone: UTC
  bootstrap:
    initdb:
      database: app
      owner: app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  storage:
    size: 5Gi
    storageClass: ceph-rbd-retain
