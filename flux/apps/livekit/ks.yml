apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-livekit-deps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-ceph-csi-rbd
    - name: infra-cilium
  path: ./flux/apps/livekit/deps
  targetNamespace: livekit
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-livekit
  namespace: flux-system
spec:
  dependsOn:
    - name: app-livekit-deps
    - name: infra-bgp
    - name: infra-gateway-api-crds
    - name: infra-gateway-private
    - name: infra-vm-operator
  path: ./flux/apps/livekit/app
  targetNamespace: livekit
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
