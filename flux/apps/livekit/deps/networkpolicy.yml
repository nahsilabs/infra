apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: livekit-lockdown
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: NotIn
        values: ["livekit-sip"]
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: livekit
    - fromEntities:
        - host
        - remote-node
