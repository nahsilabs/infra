apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: grimmory-mariadb
spec:
  rootPasswordSecretKeyRef:
    name: grimmory-mariadb-root
    key: password
    generate: true
  database: grimmory
  username: grimmory
  passwordSecretKeyRef:
    name: grimmory-mariadb-user
    key: password
    generate: true
  storage:
    size: 1Gi
    storageClassName: ceph-rbd-retain
  image: docker-registry1.mariadb.com/library/mariadb:13.0.2@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 256Mi
  replicas: 1
