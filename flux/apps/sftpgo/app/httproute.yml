---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sftpgo
spec:
  parentRefs:
    - name: private-gateway
      namespace: envoy-gateway
      sectionName: https
    - name: public-gateway
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - sftpgo.nahsi.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sftpgo
          port: 8080
      timeouts:
        request: 0s
        backendRequest: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sftpgo-webdav
spec:
  parentRefs:
    - name: private-gateway
      namespace: envoy-gateway
      sectionName: https
    - name: public-gateway
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - sftpgo.nahsi.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dav
      backendRefs:
        - name: sftpgo
          port: 8081
      timeouts:
        request: 0s
        backendRequest: 0s
