apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browsertrix
  namespace: browsertrix
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Knowledge
    gethomepage.dev/name: Browsertrix
    gethomepage.dev/href: https://browsertrix.nahsi.dev
    gethomepage.dev/icon: https://docs.browsertrix.com/assets/brand/browsertrix-icon-color.png
    gethomepage.dev/pod-selector: "app=browsertrix-cloud,role=backend"
spec:
  parentRefs:
    - name: private-gateway
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - browsertrix.nahsi.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: browsertrix-cloud-backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: browsertrix-cloud-frontend
          port: 80
