apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obs-ai-retrieval
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-prometheus-operator-crds
  path: ./flux/apps/ai/retrieval/obs/app
  targetNamespace: ai
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
