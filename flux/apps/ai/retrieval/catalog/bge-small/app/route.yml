apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bge-small-ai
spec:
  parentRefs:
    - name: agenticgateway-internal
      namespace: agenticgateway
      sectionName: https
  hostnames:
    - ai.nahsi.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/embeddings
          headers:
            - type: Exact
              name: X-Gateway-Base-Model-Name
              value: BAAI/bge-small-en-v1.5
      timeouts:
        request: 300s
        backendRequest: 300s
      backendRefs:
        - kind: Service
          name: bge-small
          port: 8080
