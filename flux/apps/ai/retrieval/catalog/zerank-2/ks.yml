apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-ai-retrieval-zerank-2
  namespace: flux-system
spec:
  dependsOn:
    - name: app-ai-gateway
    - name: infra-intel-device-plugins-gpu
  path: ./flux/apps/ai/retrieval/catalog/zerank-2/app
  targetNamespace: ai
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 30m
