apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wyoming-openai
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/roryeckel/wyoming_openai
              tag: 0.6.0@sha256:7c8ae7979933d31f359ccd3f93f496374baacd94ad4944dfcb37b39d6e89c7b0
            env:
              WYOMING_URI: tcp://0.0.0.0:10300
              WYOMING_LOG_LEVEL: INFO
              WYOMING_LANGUAGES: 'en ru'
              STT_OPENAI_URL: https://ai.nahsi.dev/v1
              STT_MODELS: nvidia/nemotron-3.5-asr-streaming-0.6b
              STT_REALTIME_MODELS: nvidia/nemotron-3.5-asr-streaming-0.6b
              TTS_OPENAI_URL: https://ai.nahsi.dev/v1
              TTS_MODELS: Qwen/Qwen3-TTS
              TTS_VOICES: polemist_v1
              STT_OPENAI_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ai-apikeys
                    key: home-assistant
              TTS_OPENAI_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ai-apikeys
                    key: home-assistant
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          wyoming:
            port: 10300
            protocol: TCP
