apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-llm
spec:
  parentRefs:
    - name: agenticgateway-internal
      namespace: agenticgateway
      sectionName: https
  hostnames:
    - ai.nahsi.dev
  rules:
    - backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayModel
          name: "*"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-llm-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-llm
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: ai-apikeys
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-inference-timeouts
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: qwen3-tts-ai
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: realtimestt-ai
      sectionName: transcription
  traffic:
    timeouts:
      request: 300s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-llm-timeouts
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-llm
  traffic:
    timeouts:
      request: 1800s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-embedding-priority
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-llm
  traffic:
    transformation:
      conditional:
        - condition: >-
            request.method == "POST" &&
            request.path == "/v1/embeddings" &&
            json(request.body).model == "Qwen/Qwen3-Embedding-0.6B"
          policy:
            request:
              # Let EPP prioritize searches over ingestion without custom client headers.
              # Infer the objective from Qwen's query prefix; leave the embedding input unchanged.
              set:
                - name: x-llm-d-inference-objective
                  value: >-
                    json(request.body).input.with(inputs,
                      (
                        type(inputs) == string
                          ? inputs.startsWith("Instruct: ")
                          : inputs.size() > 0 &&
                            inputs.all(text,
                              type(text) == string &&
                              text.startsWith("Instruct: ")
                            )
                      )
                        ? "embedding-query"
                        : "embedding-ingestion"
                    )
