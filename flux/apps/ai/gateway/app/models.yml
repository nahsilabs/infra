apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-models
  namespace: ai
spec:
  parentRefs:
    - name: agenticgateway-internal
      namespace: agenticgateway
      sectionName: https
  hostnames:
    - ai.nahsi.dev
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /v1/models
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-models
  namespace: ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-models
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: ai-apikeys
    directResponse:
      status: 200
      body: '{"object":"list","data":[{"id":"google/gemma-4-12B-it","object":"model","created":0,"owned_by":"nahsilabs"},{"id":"Qwen/Qwen3.8-27B","object":"model","created":0,"owned_by":"nahsilabs"},{"id":"nvidia/nemotron-3.5-asr-streaming-0.6b","object":"model","created":0,"owned_by":"nvidia"}]}'
      headers:
        - name: Content-Type
          value: '"application/json"'
