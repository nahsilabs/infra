apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: realtimestt-lockdown
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: realtimestt
  ingress:
    - fromEntities:
        - host
        - remote-node
        - health
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agenticgateway
            gateway.networking.k8s.io/gateway-name: agenticgateway-internal
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
