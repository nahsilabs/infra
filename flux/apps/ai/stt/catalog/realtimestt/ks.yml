apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-ai-stt-realtimestt
  namespace: flux-system
spec:
  dependsOn:
    - name: app-ai-gateway
  path: ./flux/apps/ai/stt/catalog/realtimestt/app
  targetNamespace: ai
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  ignore:
    - paths:
        - /spec/replicas
      target:
        group: apps
        kind: Deployment
        name: realtimestt
        namespace: ai
