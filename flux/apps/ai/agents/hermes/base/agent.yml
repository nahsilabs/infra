apiVersion: agents.hermeum.app/v1alpha1
kind: HermesAgent
metadata:
  name: hermes
spec:
  runtimeClassName: kata
  hermes:
    image: docker.io/nahsilabs/hermes-agent:latest@sha256:8495280692161034225b9c3086e1bba5cfb2511544079d50b68bc76b01087bc6
    workspace:
      files:
        plugin-data/hermes-snapcompact/mode.yaml: |
          mode: snapcompact
    config:
      raw:
        model:
          provider: custom
          default: Qwen/Qwen3.8-Flash-Next
          base_url: https://ai.nahsi.dev/v1
          key_env: AI_GATEWAY_API_KEY
          context_length: 262144
          streaming: true
        timezone: Europe/Athens
        agent:
          max_turns: null
          image_input_mode: native
          environment_hint: >-
            You run in a Kubernetes container, not on the user's personal computer.
            /opt/data is your persistent home; changes elsewhere in the container
            may be lost when it is replaced. Your deployment and managed
            configuration are maintained through GitOps, so local edits alone
            do not update the deployment source.
        terminal:
          backend: local
        browser:
          cloud_provider: local
          headed: false
          use_real_profile: false
        approvals:
          mode: smart
        security:
          redact_secrets: true
        telemetry:
          shared_metrics:
            enabled: true
            send: false
        nous:
          guest: false
        tools:
          connectors:
            enabled: false
        memory:
          memory_enabled: false
          user_profile_enabled: false
        context:
          engine: hermes-snapcompact
        plugins:
          enabled:
            - langfuse
        skills:
          write_approval: true
          external_dirs:
            - /opt/managed-skills
            - /opt/hermes/skills
          creation_nudge_interval: 0
          disabled:
            - airtable
            - apple-notes
            - apple-reminders
            - architecture-diagram
            - baoyu-infographic
            - box
            - claude-code
            - claude-design
            - codebase-inspection
            - codex
            - competitor-news-monitor
            - computer-use
            - design-md
            - dogfood
            - findmy
            - github
            - hermes-agent-skill-authoring
            - himalaya
            - imessage
            - inspecting-hermes-desktop-dom
            - llm-wiki
            - manim-video
            - node-inspect-debugger
            - notion
            - obsidian
            - opencode
            - p5js
            - popular-web-designs
            - python-debugpy
            - requesting-code-review
            - sdlc-review
            - simplify-code
            - songwriting-and-ai-music
            - teams-meeting-pipeline
            - test-driven-development
            - xurl
        curator:
          enabled: false
        delegation:
          max_concurrent_children: 2
        kanban:
          dispatch_in_gateway: false
          auto_decompose: false
          auto_subscribe_on_create: false
          review_dispatch: false
        moa:
          presets:
            default:
              enabled: false
        auxiliary:
          background_review:
            enabled: false
        stt:
          enabled: true
          echo_transcripts: false
          streaming: true
          provider: openai
          language: auto
          openai:
            base_url: https://ai.nahsi.dev/v1
            api_key: ${AI_GATEWAY_API_KEY}
            model: nvidia/nemotron-3.5-asr-streaming-0.6b
            streaming_model: nvidia/nemotron-3.5-asr-streaming-0.6b
        tts:
          provider: openai
          openai:
            base_url: https://ai.nahsi.dev/v1
            api_key: ${AI_GATEWAY_API_KEY}
            model: Qwen/Qwen3-TTS
            language: auto
        voice:
          auto_tts: false
          client_direct: false
        display:
          message_reactions: true
          show_reasoning: true
        updates:
          check: false
        dashboard:
          trusted_proxies:
            - 10.244.0.0/16
      apiServer:
        enabled: false
      webhook:
        enabled: false
    env:
      - name: HINDSIGHT_RECALL_INDICATOR
        value: "false"
      - name: HINDSIGHT_RETAIN_INDICATOR
        value: "false"
      - name: HERMES_LANGFUSE_BASE_URL
        value: https://langfuse.nahsi.dev
      - name: HERMES_LANGFUSE_CAPTURE
        value: sanitized
      - name: COMFYUI_URL
        value: https://comfyui.nahsi.dev
      - name: HERMES_DASHBOARD
        value: "1"
      - name: HERMES_DASHBOARD_HOST
        value: "0.0.0.0"
      - name: HERMES_DASHBOARD_PORT
        value: "9119"
      - name: HERMES_DASHBOARD_OIDC_SCOPES
        value: openid profile email offline_access
      - name: API_SERVER_ENABLED
        value: "false"
      - name: WEBHOOK_ENABLED
        value: "false"
    ports:
      - name: dashboard
        containerPort: 9119
        protocol: TCP
    probes:
      liveness: &probe
        enabled: true
        periodSeconds: 60
        timeoutSeconds: 45
      readiness: *probe
      startup: *probe
    resources:
      requests:
        cpu: "2"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 4Gi
    storage:
      snapshot:
        enabled: false
    initChownData: true
  security:
    rbac:
      createServiceAccount: true
  networking:
    service:
      type: ClusterIP
      ports:
        - name: dashboard
          port: 9119
          targetPort: 9119
          protocol: TCP
