apiVersion: agents.hermeum.app/v1alpha1
kind: HermesAgent
metadata:
  name: proba
spec:
  hermes:
    image: docker.io/nahsilabs/hermes-agent:latest@sha256:f7db7777e8207edb3bde432fa80d443ad45fd845d3a67167fd3274f6d0d5aeb2
    workspace:
      files:
        SOUL.md: |
          You are Proba, a staging agent for testing integrations, configuration changes, and agent capabilities before they are promoted to other agents. Be direct: match the length of your reply to the weight of the ask — a one-line question gets a one-line answer, and finished work gets a short report of what changed, what's verified, and what's left, never a replay of the process. No filler ("Great question," "I'd be happy to"), no restating the request back, no re-summarizing what you already said, no narrating tool calls the user can see. Plain claims over adjectives; when unsure, say so plainly. Agree because it's right, not because the user said it. Depth is earned — give it when the user asks for detail, teaches, or the stakes demand it, not by default.

          ## Rules

          - Do not create or edit skills unless the user explicitly asks you to.
          - When a request has at least two independent research questions, use
            `delegate_task` for the separate investigations. Give each child a
            self-contained, read-only goal and require sources. Verify their
            findings and write the final answer yourself. Handle simple or
            tightly coupled requests directly.
    config:
      raw:
        fallback_providers: []
        delegation:
          # Keep the shared Qwen main model; use Luna for delegated tasks.
          provider: openai-codex
          model: gpt-6-luna
          fallback_providers: []
        memory:
          provider: mnemosyne
          mnemosyne:
            sync_roles: []
            default_scope: global
            auto_sleep: true
            sleep_threshold: 50
        platform_toolsets:
          cli: &toolsets
            - terminal
            - file
            - web
            - browser
            - vision
            - skills
            - todo
            - kanban
            - session_search
            - memory
            - clarify
            - code_execution
            - delegation
            - cronjob
            - tts
          matrix: *toolsets
          telegram: *toolsets
        streaming:
          enabled: true
          transport: edit
        platforms:
          telegram:
            gateway_restart_notification: false
            extra:
              base_url: http://127.0.0.1:8081/bot
              base_file_url: http://127.0.0.1:8081/file/bot
              local_mode: true
              disable_link_previews: true
        telegram:
          reactions: false
        matrix:
          allowed_users:
            - "@me:nahsi.dev"
          require_mention: true
          session_scope: auto
          auto_thread: true
          dm_mention_threads: false
          process_notices: false
          gateway_restart_notification: false
        display:
          busy_input_mode: steer
          platforms:
            matrix:
              streaming: false
              show_reasoning: false
              tool_progress: "off"
              interim_assistant_messages: false
              long_running_notifications: false
              busy_ack_detail: false
            telegram:
              streaming: true
              show_reasoning: false
              tool_progress: "off"
              interim_assistant_messages: false
              long_running_notifications: false
              busy_ack_detail: false
              notifications: important
        tts:
          openai:
            voice: katerina
    env:
      - name: MNEMOSYNE_LLM_API_KEY
        value: $(AI_GATEWAY_API_KEY)
      - name: MNEMOSYNE_EMBEDDING_API_KEY
        value: $(AI_GATEWAY_API_KEY)
      - name: OPENROUTER_API_KEY
        value: $(AI_GATEWAY_API_KEY)
      - name: TELEGRAM_ALLOWED_CHATS
        valueFrom:
          secretKeyRef:
            name: proba-secrets
            key: TELEGRAM_ALLOWED_USERS
    envFrom:
      - configMapRef:
          name: hermes-env
      - configMapRef:
          name: proba-env
      - secretRef:
          name: proba-secrets
    storage:
      persistence:
        existingClaim: proba-home
  initContainers:
    - name: telegram-volume-permissions
      image: &telegram-image docker.io/aiogram/telegram-bot-api:latest@sha256:2d1c28ad35302c4680dc7462abd76cf11cdc8b27f33cd22c973a44cdbaabd5fc
      command: ["chown", "10000:10000", "/var/lib/telegram-bot-api"]
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN"]
      volumeMounts:
        - name: telegram-data
          mountPath: /var/lib/telegram-bot-api
  sidecars:
    - name: telegram-bot-api
      image: *telegram-image
      command: ["telegram-bot-api"]
      args:
        - --local
        - --dir=/var/lib/telegram-bot-api
        - --temp-dir=/var/lib/telegram-bot-api/temp
        - --http-ip-address=127.0.0.1
      env:
        - name: TELEGRAM_API_ID
          valueFrom:
            secretKeyRef:
              name: proba-secrets
              key: TELEGRAM_API_ID
        - name: TELEGRAM_API_HASH
          valueFrom:
            secretKeyRef:
              name: proba-secrets
              key: TELEGRAM_API_HASH
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      startupProbe:
        exec: &telegram-health
          command: ["nc", "-z", "127.0.0.1", "8081"]
        periodSeconds: 2
        failureThreshold: 30
      readinessProbe:
        exec: *telegram-health
        periodSeconds: 10
      livenessProbe:
        exec: *telegram-health
        periodSeconds: 30
      volumeMounts:
        - name: telegram-data
          mountPath: /var/lib/telegram-bot-api
  extraVolumes:
    - name: telegram-data
      persistentVolumeClaim:
        claimName: proba-telegram
  extraVolumeMounts:
    - name: telegram-data
      mountPath: /var/lib/telegram-bot-api
      readOnly: true
