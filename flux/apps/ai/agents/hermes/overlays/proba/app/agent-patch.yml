apiVersion: agents.hermeum.app/v1alpha1
kind: HermesAgent
metadata:
  name: proba
spec:
  hermes:
    image: docker.io/nahsilabs/hermes-agent:latest@sha256:8495280692161034225b9c3086e1bba5cfb2511544079d50b68bc76b01087bc6
    workspace:
      files:
        SOUL.md: |
          You are Proba, a staging agent for testing integrations, configuration changes, and agent capabilities before they are promoted to other agents. Be direct: match the length of your reply to the weight of the ask — a one-line question gets a one-line answer, and finished work gets a short report of what changed, what's verified, and what's left, never a replay of the process. No filler ("Great question," "I'd be happy to"), no restating the request back, no re-summarizing what you already said, no narrating tool calls the user can see. Plain claims over adjectives; when unsure, say so plainly. Agree because it's right, not because the user said it. Depth is earned — give it when the user asks for detail, teaches, or the stakes demand it, not by default.

          ## Rules

          - Do not call `mnemosyne_remember` unless the user explicitly asks you to
            remember something.
          - Do not create or edit skills unless the user explicitly asks you to.
    config:
      raw:
        memory:
          provider: mnemosyne
          mnemosyne:
            sync_roles:
              - user
              - assistant
            default_scope: global
            auto_sleep: true
            sleep_threshold: 50
        platform_toolsets:
          cli: &toolsets
            - terminal
            - file
            - web
            - browser
            - vision
            - skills
            - todo
            - kanban
            - session_search
            - memory
            - clarify
            - code_execution
            - delegation
            - cronjob
            - tts
          matrix: *toolsets
        matrix:
          allowed_users:
            - "@me:nahsi.dev"
          require_mention: true
          session_scope: auto
          auto_thread: true
          dm_mention_threads: false
          process_notices: false
          gateway_restart_notification: false
        display:
          platforms:
            matrix:
              show_reasoning: false
              tool_progress: "off"
              interim_assistant_messages: false
              long_running_notifications: false
              busy_ack_detail: false
        tts:
          openai:
            voice: katerina
    env:
      - name: MNEMOSYNE_LLM_API_KEY
        value: $(AI_GATEWAY_API_KEY)
      - name: MNEMOSYNE_EMBEDDING_API_KEY
        value: $(AI_GATEWAY_API_KEY)
      - name: OPENROUTER_API_KEY
        value: $(AI_GATEWAY_API_KEY)
    envFrom:
      - configMapRef:
          name: hermes-env
      - configMapRef:
          name: proba-env
      - secretRef:
          name: proba-secrets
    storage:
      persistence:
        existingClaim: proba-home
