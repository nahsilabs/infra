apiVersion: agents.hermeum.app/v1alpha1
kind: HermesAgent
metadata:
  name: proba
spec:
  hermes:
    workspace:
      files:
        hindsight/config.json: |
          {
            "mode": "local_external",
            "api_url": "https://hindsight.nahsi.dev",
            "bank_id": "hermes-proba"
          }
    config:
      raw:
        memory:
          provider: hindsight
        platform_toolsets:
          matrix:
            - terminal
            - file
            - web
            - browser
            - vision
            - skills
            - todo
            - kanban
            - session_search
            - memory
            - clarify
            - code_execution
            - delegation
            - cronjob
            - tts
        matrix:
          allowed_users:
            - "@me:nahsi.dev"
          require_mention: true
          session_scope: auto
          auto_thread: true
          dm_mention_threads: false
          process_notices: false
        display:
          platforms:
            matrix:
              show_reasoning: false
              tool_progress: "off"
              interim_assistant_messages: false
              long_running_notifications: false
              busy_ack_detail: false
        tts:
          openai:
            voice: katerina
    envFrom:
      - configMapRef:
          name: proba-env
      - secretRef:
          name: proba-credentials
      - secretRef:
          name: proba-hindsight-auth
    storage:
      persistence:
        existingClaim: proba-home
