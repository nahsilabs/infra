apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-agents-heron
resources:
  - ../../../base
  - secrets.yml
  - env.yml
  - networkpolicy.yml
  - pvc.yml
  - route.yml
patches:
  - path: agent-patch.yml
    options:
      allowNameChange: true
    target:
      group: agents.hermeum.app
      version: v1alpha1
      kind: HermesAgent
      name: hermes
