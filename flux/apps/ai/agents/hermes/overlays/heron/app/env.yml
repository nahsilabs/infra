apiVersion: v1
kind: ConfigMap
metadata:
  name: heron-env
data:
  HERMES_LANGFUSE_ENV: production
  OTEL_SERVICE_NAME: heron
  HERMES_DASHBOARD_PUBLIC_URL: https://heron.agents.nahsi.dev
  HERMES_DASHBOARD_OIDC_ISSUER: https://auth.nahsi.dev/application/o/hermes-heron/
  MATRIX_HOMESERVER: https://matrix.nahsi.dev
  MATRIX_USER_ID: "@heron:nahsi.dev"
  MATRIX_E2EE_MODE: "off"
  MATRIX_REACTIONS: "false"
  MATRIX_DM_AUTO_THREAD: "false"
  MATRIX_APPROVAL_REQUIRE_SENDER: "true"
  MATRIX_ALLOW_ROOM_MENTIONS: "false"
