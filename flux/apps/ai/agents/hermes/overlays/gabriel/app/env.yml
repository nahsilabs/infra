apiVersion: v1
kind: ConfigMap
metadata:
  name: gabriel-env
data:
  HERMES_LANGFUSE_ENV: production
  HERMES_DASHBOARD_PUBLIC_URL: https://gabriel.agents.nahsi.dev
  HERMES_DASHBOARD_OIDC_ISSUER: https://auth.nahsi.dev/application/o/hermes-gabriel/
  MNEMOSYNE_DATA_DIR: /opt/data/mnemosyne/data
  MNEMOSYNE_LLM_ENABLED: "true"
  MNEMOSYNE_HOST_LLM_ENABLED: "false"
  MNEMOSYNE_LLM_BASE_URL: https://ai.nahsi.dev/v1
  MNEMOSYNE_LLM_MODEL: Qwen/Qwen3.8-Flash-Next
  MNEMOSYNE_EMBEDDINGS_VIA_API: "true"
  MNEMOSYNE_EMBEDDING_API_URL: https://ai.nahsi.dev/v1
  MNEMOSYNE_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
  MNEMOSYNE_EMBEDDING_DIM: "1024"
  MNEMOSYNE_EMBEDDING_QUERY_PREFIX: "Instruct: Given a query, retrieve relevant passages that answer the query.\nQuery: "
  MNEMOSYNE_LEXICAL_GATE_MIN: "0"
  OPENROUTER_BASE_URL: https://ai.nahsi.dev/v1
  MNEMOSYNE_EXTRACTION_MODEL: Qwen/Qwen3.8-Flash-Next
