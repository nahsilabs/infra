apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: translategemma-public
  namespace: agenticgateway
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - ai.nahsi.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - name: agenticgateway-internal
          port: 80
