apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-ai-llm-gemma-4-12b-it
  namespace: flux-system
spec:
  dependsOn:
    - name: app-ai-gateway
    - name: infra-intel-device-plugins-gpu
  path: ./flux/apps/ai/llm/catalog/gemma-4-12b-it/app
  targetNamespace: ai
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  ignore:
    - paths:
        - /spec/replicas
      target:
        group: apps
        version: v1
        kind: Deployment
        name: gemma-4-12b-it
        namespace: ai
