apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-4-12b-it
  labels:
    app.kubernetes.io/name: gemma-4-12b-it
    app.kubernetes.io/part-of: llama-cpp
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gemma-4-12b-it
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gemma-4-12b-it
        app.kubernetes.io/part-of: llama-cpp
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-intel-b10820@sha256:35037559d99a90963d479b6e6e79764b138c76dc657341292aac6ad41d627c9f
          args:
            - -hf
            - unsloth/gemma-4-12B-it-qat-GGUF
            - -hff
            - gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
            - -a
            - google/gemma-4-12B-it
            - -c
            - "16384"
            - -np
            - "1"
            - -kvu
            - -fit
            - "on"
            - -fitt
            - "1024"
            - -fitc
            - "4096"
            - -t
            - "4"
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "4"
            - --no-mmproj
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --jinja
            - --ctx-checkpoints
            - "0"
            - -cram
            - "2048"
            - --metrics
          env:
            - name: HOME
              value: /models
            - name: LLAMA_CACHE
              value: /models
            - name: ONEAPI_DEVICE_SELECTOR
              value: level_zero:0
            - name: UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS
              value: "1"
            - name: ZES_ENABLE_SYSMAN
              value: "1"
            - name: GGML_SYCL_ENABLE_FLASH_ATTN
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 6Gi
              gpu.intel.com/xe: "1"
            limits:
              cpu: "4"
              memory: 12Gi
              ephemeral-storage: 8Gi
              gpu.intel.com/xe: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: gemma-4-12b-it-cache
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-4-12b-it
  labels:
    app.kubernetes.io/name: gemma-4-12b-it
    app.kubernetes.io/part-of: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: gemma-4-12b-it
  ports:
    - name: http
      port: 8080
      targetPort: http
