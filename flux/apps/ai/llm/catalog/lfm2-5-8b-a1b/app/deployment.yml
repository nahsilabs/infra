apiVersion: apps/v1
kind: Deployment
metadata:
  name: lfm2-5-8b-a1b
  labels:
    app.kubernetes.io/name: lfm2-5-8b-a1b
    app.kubernetes.io/part-of: llama-cpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lfm2-5-8b-a1b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lfm2-5-8b-a1b
        app.kubernetes.io/part-of: llama-cpp
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-intel-b9853@sha256:d11634740e3361992cd336dcccb2b0c78c89b750cb468648cbf86814dd1f2ab7
          args:
            - -hf
            - LiquidAI/LFM2.5-8B-A1B-GGUF
            - -hff
            - LFM2.5-8B-A1B-Q4_K_M.gguf
            - -a
            - LiquidAI/LFM2.5-8B-A1B
            - -c
            - "32768"
            - -np
            - "4"
            - -kvu
            - -ctk
            - q8_0
            - -ctv
            - q8_0
            - -fit
            - "on"
            - -fitt
            - "2048"
            - -t
            - "4"
            - --temp
            - "0.2"
            - --top-k
            - "80"
            - --repeat-penalty
            - "1.05"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --jinja
            - -cram
            - "512"
            - --metrics
          env:
            - name: HOME
              value: /models
            - name: LLAMA_CACHE
              value: /models
            - name: ONEAPI_DEVICE_SELECTOR
              value: level_zero:0
            - name: UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS
              value: "1"
            - name: ZES_ENABLE_SYSMAN
              value: "1"
            - name: GGML_SYCL_ENABLE_FLASH_ATTN
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 6Gi
              gpu.intel.com/xe: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 8Gi
              gpu.intel.com/xe: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: lfm2-5-8b-a1b-cache
---
apiVersion: v1
kind: Service
metadata:
  name: lfm2-5-8b-a1b
  labels:
    app.kubernetes.io/name: lfm2-5-8b-a1b
    app.kubernetes.io/part-of: llama-cpp
spec:
  selector:
    app.kubernetes.io/name: lfm2-5-8b-a1b
  ports:
    - name: http
      port: 8080
      targetPort: http
