apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-halogen-defaults
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: ai-llm
  traffic:
    transformation:
      conditional:
      # Halogen rejects JSON mode with images; ShareTab relies on the prompt instead.
      - condition: |-
          request.method == "POST" && request.path == "/v1/chat/completions" &&
          json(request.body).model == "sharetab-receipt"
        policy:
          request:
            body: |-
              json(request.body).with(r,
                toJson(r.filterKeys(k, k != "response_format").merge({
                  "model": "Qwen/Qwen3.8-Flash-Next",
                  "reasoning_effort": "none",
                  "temperature": 0,
                  "presence_penalty": 0,
                  "messages": [{
                    "role": "system",
                    "content": "Return only valid JSON matching the requested receipt structure, without markdown. All monetary values must be non-negative integers in cents."
                  }] + r.messages
                }))
              )
      # Re-serializing the body shuffles JSON key order, which breaks Halogen's prompt
      # cache; requests that already set every default pass through unchanged.
      - condition: |-
          request.method == "POST" && request.path in ["/v1/chat/completions", "/v1/responses"] && json(request.body).with(r,
            r.model == "Qwen/Qwen3.8-Flash-Next" &&
            !(has(r.temperature) && has(r.top_p) && has(r.top_k) && has(r.presence_penalty)) &&
            (
              default(r.reasoning_effort, "") == "none" ||
              default(r.reasoning.effort, "") == "none" ||
              default(r.reasoning.enabled, true) == false ||
              default(r.enable_thinking, true) == false ||
              default(r.chat_template_kwargs.enable_thinking, true) == false ||
              default(r.chat_template_kwargs.reasoning_effort, "") == "none" ||
              default(r.thinking.type, "") == "disabled"
            )
          )
        policy:
          request:
            body: |-
              json(request.body).with(r,
                toJson({
                  "temperature": 0.7,
                  "top_p": 0.8,
                  "top_k": 20,
                  "presence_penalty":
                    default(r.temperature, 0.7) == 0 ? 0.0 : 1.5
                }.merge(r))
              )
