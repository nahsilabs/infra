apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: qwen3-8-27b-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: qwen3-8-27b-ai
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: ai-apikeys
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: qwen3-8-27b-defaults
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: qwen3-8-27b-ai
  traffic:
    transformation:
      conditional:
        - condition: >-
            request.path.startsWith("/v1/chat/completions") &&
            !("reasoning_effort" in json(request.body)) &&
            !("enable_thinking" in json(request.body))
          policy:
            request:
              body: >-
                toJson(json(request.body).merge({
                  "reasoning_effort": "medium"
                }))
