apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8-27b
  labels:
    app.kubernetes.io/name: qwen3-8-27b
    app.kubernetes.io/part-of: ninfer
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3-8-27b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-8-27b
        app.kubernetes.io/part-of: ninfer
    spec:
      nodeSelector:
        kubernetes.io/hostname: pergamon
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ninfer
          image: docker.io/nahsilabs/ninfer-4090@sha256:ede1d9dc61c08625de3636417ac71c39bd11f3102a8a15967df924bc56a9188e
          command:
            - ninfer-serve
          args:
            - /models/qwen3_8_27b.ninfer
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --max-context
            - "262144"
            - --kv-capacity
            - "262144"
            - --max-concurrency
            - "2"
            - --max-pending-requests
            - "16"
            - --pending-timeout-ms
            - "600000"
            - --prefill-chunk
            - "1024"
            - --kv-dtype
            - rk4v4-e8
            - --spec
            - mtp
            - --draft-tokens
            - "3"
            - --lm-head-draft
            - --preserve-thinking
            - --vision
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "4"
              memory: 20Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 72
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: qwen3-8-27b
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-8-27b
  labels:
    app.kubernetes.io/name: qwen3-8-27b
    app.kubernetes.io/part-of: ninfer
spec:
  selector:
    app.kubernetes.io/name: qwen3-8-27b
  ports:
    - name: http
      port: 8080
      targetPort: http
