apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-ai-llm-qwen3-8-27b-model
  namespace: flux-system
spec:
  suspend: true
  path: ./flux/apps/ai/llm/catalog/qwen3-8-27b/model
  targetNamespace: ai
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 6h
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-ai-llm-qwen3-8-27b
  namespace: flux-system
spec:
  dependsOn:
