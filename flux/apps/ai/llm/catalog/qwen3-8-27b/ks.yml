  timeout: 15m
  ignore:
    - paths:
        - /spec/replicas
      target:
        group: apps
        kind: Deployment
        name: qwen3-8-27b
        namespace: ai
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obs-ai-llm-qwen3-8-27b
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: app-ai-llm-qwen3-8-27b
