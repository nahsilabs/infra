apiVersion: batch/v1
kind: Job
metadata:
  name: qwen3-8-27b-model
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-8-27b-model
        app.kubernetes.io/part-of: ninfer
    spec:
      nodeSelector:
        kubernetes.io/hostname: pergamon
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model
          image: docker.io/curlimages/curl@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
          command:
            - /bin/sh
            - -ec
          args:
            - |
              part="${MODEL_PATH}.part"
              if [ -f "${MODEL_PATH}" ] && echo "${MODEL_SHA256}  ${MODEL_PATH}" | sha256sum -c -; then
                exit 0
              fi
              if [ -f "${part}" ] && echo "${MODEL_SHA256}  ${part}" | sha256sum -c -; then
                mv "${part}" "${MODEL_PATH}"
                exit 0
              fi
              rm -f "${MODEL_PATH}"
              curl --fail --location --retry 5 --retry-all-errors --continue-at - --output "${part}" "${MODEL_URL}"
              if ! echo "${MODEL_SHA256}  ${part}" | sha256sum -c -; then
                rm -f "${part}"
                exit 1
              fi
              mv "${part}" "${MODEL_PATH}"
          env:
            - name: MODEL_PATH
              value: /models/qwen3_8_27b.ninfer
            - name: MODEL_SHA256
              value: eec39564993d6e9c7d5e383382a760f093465c9d163ec9a1bd6b80199514bf3e
            - name: MODEL_URL
              value: https://huggingface.co/neroued/Qwen3.8-27B-NInfer/resolve/main/qwen3_8_27b.ninfer
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: qwen3-8-27b
