apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-notebook
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/lfnovo/open-notebook
              tag: 1.14.0@sha256:e53f90d6153fcf4a64604d9a0c12cb0428a32cfb8dbcbb72e81ab12c013ee330
            env:
              API_URL: https://notebook.nahsi.dev
              INTERNAL_API_URL: http://localhost:5055
              CORS_ORIGINS: https://notebook.nahsi.dev
              SURREAL_URL: ws://surrealdb.open-notebook.svc.cluster.local:8000/rpc
              SURREAL_NAMESPACE: open_notebook
              SURREAL_DATABASE: open_notebook
              OPEN_NOTEBOOK_EMBEDDING_BATCH_SIZE: "8"
              OPEN_NOTEBOOK_WORKER_MAX_TASKS: "1"
            envFrom:
              - secretRef:
                  name: open-notebook
            probes:
              liveness:
                type: HTTP
                path: /health
                port: 5055
              readiness:
                type: HTTP
                path: /health
                port: 5055
              startup:
                type: HTTP
                path: /health
                port: 5055
                spec:
                  initialDelaySeconds: 10
                  failureThreshold: 30
                  periodSeconds: 5

    service:
      main:
        controller: main
        ports:
          http:
            port: 8502
          api:
            port: 5055

    persistence:
      data:
        existingClaim: open-notebook-data
        globalMounts:
          - path: /app/data

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Apps
          gethomepage.dev/name: Open Notebook
          gethomepage.dev/icon: open-notebook.png
          gethomepage.dev/pod-selector: app.kubernetes.io/name=open-notebook
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - notebook.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            timeouts:
              request: 300s
              backendRequest: 300s
            backendRefs:
              - identifier: main
                port: http
                weight: 1
