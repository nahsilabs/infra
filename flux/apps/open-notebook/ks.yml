---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-open-notebook-deps
  namespace: flux-system
spec:
  path: ./flux/apps/open-notebook/deps
  targetNamespace: open-notebook
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-open-notebook
  namespace: flux-system
spec:
  dependsOn:
    - name: app-open-notebook-deps
    - name: infra-gateway-api-crds
  path: ./flux/apps/open-notebook/app
  targetNamespace: open-notebook
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
