apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-postgres
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: pg-hindsight-memory
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hindsight
            app.kubernetes.io/name: hindsight
            app.kubernetes.io/component: api
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hindsight
            cnpg.io/cluster: pg-hindsight-memory
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: obs-collect
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hindsight
            cnpg.io/cluster: pg-hindsight-memory
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
