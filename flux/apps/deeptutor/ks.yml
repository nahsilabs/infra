apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-deeptutor
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-gateway-api-crds
  path: ./flux/apps/deeptutor/app
  targetNamespace: deeptutor
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 10m
