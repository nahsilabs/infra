apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
            envFrom:
              - secretRef:
                  name: open-webui-secret
              - secretRef:
                  name: open-webui-fastcrw
            env:
              WEBUI_URL: https://chat.nahsi.dev
              CORS_ALLOW_ORIGIN: https://chat.nahsi.dev
              WEBUI_SESSION_COOKIE_SECURE: "true"
              WEBUI_AUTH_COOKIE_SECURE: "true"

              ENABLE_LOGIN_FORM: "false"
              ENABLE_PASSWORD_AUTH: "false"
              ENABLE_SIGNUP: "false"
              ENABLE_OAUTH_SIGNUP: "true"
              DEFAULT_USER_ROLE: user
              OAUTH_AUTO_REDIRECT: "true"
              OAUTH_PROVIDER_NAME: Authentik
              OPENID_PROVIDER_URL: https://auth.nahsi.dev/application/o/open-webui/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.nahsi.dev/oauth/oidc/callback

              ENABLE_ADMIN_CHAT_ACCESS: "false"
              ENABLE_ADMIN_EXPORT: "false"
              ENABLE_ADMIN_WORKSPACE_CONTENT_ACCESS: "false"
              BYPASS_ADMIN_ACCESS_CONTROL: "false"
              OFFLINE_MODE: "true"

              ENABLE_PERSISTENT_CONFIG: "false"
              SHOW_ADMIN_DETAILS: "false"
              ENABLE_AUTOMATIONS: "false"
              ENABLE_CALENDAR: "false"
              ENABLE_EVALUATION_ARENA_MODELS: "false"
              ENABLE_COMMUNITY_SHARING: "false"
              DEFAULT_MODELS: Qwen/Qwen3.8-Flash-Next
              DEFAULT_MODEL_METADATA: >-
                {"builtinTools":{"subagents":false,"notifications":false},"capabilities":{"usage":true,"memory":true,"vision":false,"terminal":true,"citations":true,"web_search":true,"file_upload":true,"file_context":true,"builtin_tools":true,"status_updates":true,"code_interpreter":true,"image_generation":false},"defaultFeatureIds":["web_search"]}
              DEFAULT_INTERFACE_SETTINGS: >-
                {"hapticFeedback":true,"copyFormatted":true,"showChangelog":false,"autoFollowUps":false,"autoTags":false,"insertSuggestionPrompt":true,"largeTextAsFile":true,"iframeSandboxAllowForms":false,"imageCompression":true,"imageCompressionSize":{"width":2048,"height":2048},"webSearch":"always","voiceInterruption":true}

              ENABLE_OLLAMA_API: "false"
              OPENAI_API_BASE_URL: https://ai.nahsi.dev/v1
              RAG_OPENAI_API_BASE_URL: https://ai.nahsi.dev/v1
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
              RAG_EMBEDDING_BATCH_SIZE: "1"
              RAG_EMBEDDING_CONCURRENT_REQUESTS: "2"
              RAG_EMBEDDING_QUERY_PREFIX: "Instruct: Given a query, retrieve relevant passages that answer the query.\nQuery: "
              RAG_EMBEDDING_CONTENT_PREFIX: ""
              ENABLE_RAG_HYBRID_SEARCH: "true"
              RAG_RERANKING_ENGINE: external
              RAG_RERANKING_MODEL: zeroentropy/zerank-2
              RAG_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secret
                    key: OPENAI_API_KEY
              RAG_EXTERNAL_RERANKER_URL: https://ai.nahsi.dev/v1/rerank
              RAG_EXTERNAL_RERANKER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secret
                    key: OPENAI_API_KEY
              RAG_EMBEDDING_MODEL_TRUST_REMOTE_CODE: "false"

              ENABLE_WEB_SEARCH: "true"
              WEB_SEARCH_ENGINE: firecrawl
              WEB_SEARCH_RESULT_COUNT: "10"
              WEB_LOADER_ENGINE: firecrawl
              WEB_LOADER_CONCURRENT_REQUESTS: "2"
              FIRECRAWL_API_BASE_URL: https://fastcrw.nahsi.dev/firecrawl
              FIRECRAWL_TIMEOUT: "60"
              SEARXNG_QUERY_URL: http://searxng.searxng.svc.cluster.local:8080/search

              AUDIO_STT_ENGINE: openai
              AUDIO_STT_MODEL: nvidia/nemotron-3.5-asr-streaming-0.6b
              AUDIO_STT_OPENAI_API_BASE_URL: https://ai.nahsi.dev/v1
              AUDIO_STT_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secret
                    key: OPENAI_API_KEY
              AUDIO_TTS_ENGINE: openai
              AUDIO_TTS_MODEL: Qwen/Qwen3-TTS
              AUDIO_TTS_VOICE: neil
              AUDIO_TTS_OPENAI_API_BASE_URL: https://ai.nahsi.dev/v1
              AUDIO_TTS_OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secret
                    key: OPENAI_API_KEY

              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: pg-open-webui-app
                    key: uri
              VECTOR_DB: pgvector
              PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH: "1024"
              PGVECTOR_CREATE_EXTENSION: "false"
              REDIS_URL: redis://open-webui-valkey.open-webui.svc.cluster.local:6379/0
              WEBSOCKET_MANAGER: redis

              STORAGE_PROVIDER: s3
              S3_ENDPOINT_URL: https://s3.nahsi.dev:9000
              S3_BUCKET_NAME: open-webui
              S3_ADDRESSING_STYLE: path

            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080

    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /app/backend/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Productivity
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/icon: open-webui.png
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=open-webui"
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
          - name: public-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - chat.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            timeouts:
              request: 900s
              backendRequest: 900s
            backendRefs:
              - identifier: main
                port: http
                weight: 1
