apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
            envFrom:
              - secretRef:
                  name: open-webui-secret
            env:
              WEBUI_URL: https://chat.nahsi.dev
              CORS_ALLOW_ORIGIN: https://chat.nahsi.dev
              WEBUI_SESSION_COOKIE_SECURE: "true"
              WEBUI_AUTH_COOKIE_SECURE: "true"

              ENABLE_LOGIN_FORM: "false"
              ENABLE_PASSWORD_AUTH: "false"
              ENABLE_SIGNUP: "false"
              ENABLE_OAUTH_SIGNUP: "true"
              DEFAULT_USER_ROLE: user
              OAUTH_AUTO_REDIRECT: "true"
              OAUTH_PROVIDER_NAME: Authentik
              OPENID_PROVIDER_URL: https://auth.nahsi.dev/application/o/open-webui/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.nahsi.dev/oauth/oidc/callback

              # Analytics remains enabled, including its admin message-query API.
              ENABLE_ADMIN_CHAT_ACCESS: "false"
              ENABLE_ADMIN_EXPORT: "false"
              ENABLE_ADMIN_WORKSPACE_CONTENT_ACCESS: "false"
              BYPASS_ADMIN_ACCESS_CONTROL: "false"
              OFFLINE_MODE: "true"

              # Seed provider connections; subsequent application settings live in the UI.
              ENABLE_OLLAMA_API: "false"
              OPENAI_API_BASE_URL: https://ai.nahsi.dev/v1
              RAG_EMBEDDING_ENGINE: openai
              RAG_EMBEDDING_MODEL: BAAI/bge-m3
              RAG_EMBEDDING_MODEL_TRUST_REMOTE_CODE: "false"
              AUDIO_STT_ENGINE: openai
              AUDIO_TTS_ENGINE: openai

              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: pg-open-webui-app
                    key: uri
              VECTOR_DB: pgvector
              PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH: "1024"
              PGVECTOR_CREATE_EXTENSION: "false"
              REDIS_URL: redis://open-webui-valkey.open-webui.svc.cluster.local:6379/0
              WEBSOCKET_MANAGER: redis

              STORAGE_PROVIDER: s3
              S3_ENDPOINT_URL: https://s3.nahsi.dev:9000
              S3_BUCKET_NAME: open-webui
              S3_ADDRESSING_STYLE: path

            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                type: HTTP
                path: /health
                port: 8080
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      main:
        controller: main
        ports:
          http:
            port: 8080

    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /app/backend/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Productivity
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/icon: open-webui.png
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=open-webui"
        parentRefs:
          - name: private-gateway
            namespace: envoy-gateway
            sectionName: https
          - name: public-gateway
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - chat.nahsi.dev
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            timeouts:
              request: 900s
              backendRequest: 900s
            backendRefs:
              - identifier: main
                port: http
                weight: 1
