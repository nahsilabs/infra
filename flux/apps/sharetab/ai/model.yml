apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: sharetab-receipts
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ai-llm
  match:
    model: sharetab-receipts
  provider: Custom
  custom:
    backendRef:
      kind: Service
      name: qwen3-8-27b
      port: 8080
    formats:
      - type: Completions
        path: /v1/chat/completions
  policies:
    transformations:
      - field: model
        expression: '"qwen3.8-27b"'
      - field: response_format
        expression: '{"type": "text"}'
      - field: enable_thinking
        expression: 'false'
      - field: messages
        expression: >-
          llmRequest.messages.map(m, m.role == "user" ? {
            "role": m.role,
            "content": m.content.map(p, p.type == "text" ? {
              "type": "text",
              "text": "You are a receipt parser. Extract structured data from this receipt image.\n\n"
                + "Return a JSON object with exactly this structure:\n"
                + "{\"merchantName\":\"store name; omit this field if unknown\",\"date\":\"YYYY-MM-DD; omit this field if unknown\","
                + "\"items\":[{\"name\":\"item description\",\"quantity\":1,\"unitPrice\":499,\"totalPrice\":499}],"
                + "\"subtotal\":1299,\"tax\":104,\"tip\":0,\"total\":1403,\"currency\":\"USD\"}\n\n"
                + "CRITICAL RULES:\n"
                + "- All monetary values MUST be integers in cents (e.g., $12.99 = 1299)\n"
                + "- Every line item on the receipt must appear in the items array\n"
                + "- quantity * unitPrice should equal totalPrice for each item\n"
                + "- subtotal should equal the sum of all item totalPrices\n"
                + "- total should equal subtotal + tax + tip\n"
                + "- If you cannot read a value clearly, make your best estimate\n"
                + "- Omit date and merchantName when unknown; never use null for these fields\n"
                + "- Do not include any text outside the JSON object\n"
                + "- Return ONLY valid JSON, no markdown code fences"
                + (p.text.contains("<user_correction>") ? "\n<user_correction>" + p.text.split("<user_correction>")[1] : "")
            } : p)
          } : m)
