apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-evebox
  namespace: flux-system
spec:
  path: ./flux/apps/evebox/app
  targetNamespace: evebox
  prune: true
  dependsOn:
    - name: infra-gateway-api-crds
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
