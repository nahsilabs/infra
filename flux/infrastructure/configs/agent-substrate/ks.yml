apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-agent-substrate-configs
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  prune: true
  wait: true
  dependsOn:
    - name: infra-agent-substrate
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  path: ./flux/infrastructure/configs/agent-substrate/app
  healthCheckExprs:
    - apiVersion: ate.dev/v1alpha1
      kind: WorkerPool
      current: >-
        has(status.replicas) &&
        has(status.readyReplicas) &&
        status.replicas == spec.replicas &&
        status.readyReplicas == spec.replicas
