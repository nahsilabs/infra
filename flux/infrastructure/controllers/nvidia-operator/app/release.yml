apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: gpu-operator
      version: "v26.7.1"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    operator:
      version: v26.7.1@sha256:b844f9c033e748b8f9925f791f426a531ee8a855f04d4ccea365378634bcefe5
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local

    cdi:
      enabled: true
      nriPluginEnabled: false

    clusterPolicy:
      deployCR: true
    gpuCluster:
      deployCR: false

    validator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 512Mi

    daemonsets:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    devicePlugin:
      resources:
        requests:
          cpu: 100m
          memory: 30Mi
        limits:
          cpu: 300m
          memory: 128Mi
      env:
        - name: NVIDIA_CDI_HOOK_PATH
          value: /usr/local/bin/nvidia-ctk

    migManager:
      enabled: false

    mig:
      strategy: none

    nfd:
      enabled: false

    gfd:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 40Mi
        limits:
          cpu: 200m
          memory: 128Mi

    vgpuDeviceManager:
      enabled: false

    vfioManager:
      enabled: false

    dcgmExporter:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          obs.nahsilabs/metrics: "true"
        relabelings:
          - action: replace
            sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: instance
            regex: (.*)
            replacement: $1.talos
      env:
        - name: DCGM_EXPORTER_INTERVAL
          value: "15000"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    sandboxDevicePlugin:
      enabled: false
