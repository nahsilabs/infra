apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podcert-ate-dev-signer
rules:
  - apiGroups:
      - ''
    resources:
      - services
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - certificates.k8s.io
    resources:
      - podcertificaterequests
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - certificates.k8s.io
    resources:
      - clustertrustbundles
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - delete
  - apiGroups:
      - certificates.k8s.io
    resources:
      - podcertificaterequests/status
    verbs:
      - update
  - apiGroups:
      - certificates.k8s.io
    resources:
      - signers
    resourceNames:
      - servicedns.podcert.ate.dev/*
      - podidentity.podcert.ate.dev/*
      - postgres.podcert.ate.dev/*
    verbs:
      - sign
      - attest
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podcert-ate-dev-signer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: podcert-ate-dev-signer
subjects:
  - kind: ServiceAccount
    namespace: ate-certs
    name: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ate-certs
  name: coordinator
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podcertificate-controller-is-a-coordinator
  namespace: ate-certs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coordinator
subjects:
  - kind: ServiceAccount
    namespace: ate-certs
    name: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podcertificate-controller
  namespace: ate-certs
  labels:
    app: podcertificate-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podcertificate-controller
  template:
    metadata:
      labels:
        app: podcertificate-controller
    spec:
      containers:
        - name: controller
          image: docker.io/nahsilabs/ate-certs:b73ee7f@sha256:af32e5ea786b668bf74821c3108887f29b1d50c716d98baae74300ab18f265c8
          args:
            - --in-cluster=true
            - --sharding-pod-namespace=$(POD_NAMESPACE)
            - --sharding-pod-name=$(POD_NAME)
            - --sharding-pod-uid=$(POD_UID)
            - --sharding-application-name=podcertificate-controller
            - --service-dns-ca-pool=/run/ca-state/service-dns-pool.json
            - --pod-identity-ca-pool=/run/ca-state/pod-identity-pool.json
            - --postgres-ca-pool=/run/ca-state/postgres-pool.json
            - --postgres-client-namespace=ate-system
            - --workers-per-signer=$(WORKERS_PER_SIGNER)
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: WORKERS_PER_SIGNER
              value: '1'
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          volumeMounts:
            - name: ca-state
              mountPath: /run/ca-state
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: ca-state
          projected:
            sources:
              - secret:
                  name: service-dns-ca-pool
                  items:
                    - key: pool
                      path: service-dns-pool.json
              - secret:
                  name: pod-identity-ca-pool
                  items:
                    - key: pool
                      path: pod-identity-pool.json
              - secret:
                  name: postgres-ca-pool
                  items:
                    - key: pool
                      path: postgres-pool.json
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
