apiVersion: v1
kind: ServiceAccount
metadata:
  name: atenet-router
  namespace: ate-system
  labels:
    app: atenet-router
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atenet-router-agentgateway-config
  namespace: ate-system
data:
  config.yaml: |
    config:
      statsAddr: 0.0.0.0:15020
    gateways:
      http:
        port: 8080
        protocol: HTTP
      https:
        port: 8443
        protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
    backends:
      - name: dynamic
        dynamic: {}
        policies:
          http:
            version: HTTP/1.1
          backendTunnel:
            proxy:
              backend: /dynamic
            mode: connect
            policies:
              backendTLS:
                cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
                subjectAltNames:
                  - spiffe://cluster.local/ns/ate-workers/sa/default
    routes:
      - name: substrate-actors
        gateways:
          - http
          - https
        matches:
          - path:
              pathPrefix: /
        policies: &id001
          substrateIngress:
            host: api.ate-system.svc:443
            connectTargetPort: 8443
            policies:
              backendTLS:
                cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                root: /run/servicedns-ca/trust-bundle.pem
        backends:
          - backend: /dynamic
      - name: substrate-actors-grpc
        gateways:
          - http
          - https
        matches: &id002
          - method: POST
            headers:
              - name: content-type
                value:
                  regex: (?i)^application/grpc([+;].*)?$
        policies: *id001
        backends: &id003
          - backend: /dynamic
            policies:
              http:
                version: HTTP/2.0
    binds:
      - port: 8081
        tunnelProtocol: connect
        listeners:
          - protocol: HTTP
            routes: []
      - port: 8444
        tunnelProtocol: connect
        listeners:
          - protocol: HTTPS
            tls:
              cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
              key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
            routes: []
      - mode: internal
        listeners:
          - protocol: HTTP
            routes:
              - name: substrate-actors-tunneled
                matches:
                  - path:
                      pathPrefix: /
                policies: *id001
                backends:
                  - backend: /dynamic
              - name: substrate-actors-tunneled-grpc
                matches: *id002
                policies: *id001
                backends: *id003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atenet-router
  namespace: ate-system
  labels:
    app: atenet-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-router
  template:
    metadata:
      labels:
        app: atenet-router
    spec:
      serviceAccountName: atenet-router
      terminationGracePeriodSeconds: 60
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v0.0.0-alpha.168b05d6@sha256:5e8384d1fcfdc443a3ad5155ea6a64dc7953bde162df7f5f8e131a5c19ae08a3
          args:
            - -f
            - /etc/agentgateway/config.yaml
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: connect
              containerPort: 8081
            - name: connect-tls
              containerPort: 8444
            - name: readiness
              containerPort: 15021
            - name: stats
              containerPort: 15020
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: readiness
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: readiness
            periodSeconds: 1
            failureThreshold: 60
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway
              readOnly: true
            - name: servicedns
              mountPath: /run/servicedns.podcert.ate.dev
              readOnly: true
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
            - name: servicedns-ca
              mountPath: /run/servicedns-ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: atenet-router-agentgateway-config
        - name: servicedns
          projected:
            sources:
              - podCertificate:
                  signerName: servicedns.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: podidentity.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: atenet-router
  namespace: ate-system
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: atenet-router
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
    - name: connect
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: connect-tls
      port: 8444
      targetPort: 8444
      protocol: TCP
