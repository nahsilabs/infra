apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-api-server
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - watch
      - list
  - apiGroups:
      - ate.dev
    resources:
      - workerpools
      - sandboxconfigs
      - csidriverconfigs
    verbs:
      - get
      - watch
      - list
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - watch
      - list
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-api-server
  namespace: ate-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-api-server
subjects:
  - kind: ServiceAccount
    name: ate-api-server
    namespace: ate-system
roleRef:
  kind: ClusterRole
  name: ate-api-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ate-api-server
  template:
    metadata:
      labels:
        app: ate-api-server
    spec:
      serviceAccountName: ate-api-server
      terminationGracePeriodSeconds: 40
      initContainers:
        - name: snapshot-plugin
          image: docker.io/nahsilabs/ate-snapshot:b73ee7f@sha256:2b6071184c4714032d7aa409c357bc17a47b75f1caf9243d30f6e19d01759262
          restartPolicy: Always
          args:
            - control
            - --socket=/run/snapshot-plugin/control.sock
          startupProbe:
            exec:
              command:
                - /ko-app/snapshot-plugin
                - healthcheck
                - --socket=/run/snapshot-plugin/control.sock
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            capabilities:
              drop:
                - ALL
          env:
            - name: ATE_STORAGE_BACKEND
              value: s3
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ENDPOINT_URL
              value: https://s3.nahsi.dev:9000
            - name: AWS_S3_USE_PATH_STYLE
              value: 'true'
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: agent-substrate-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-substrate-s3
                  key: AWS_SECRET_ACCESS_KEY
          envFrom:
            - configMapRef:
                name: ate-otel-config
          volumeMounts:
            - name: snapshot-plugin
              mountPath: /run/snapshot-plugin
      containers:
        - name: ate-api-server
          image: docker.io/nahsilabs/ate-api:b73ee7f@sha256:5976d79f09e203650679b22d2ddfa23e7cebe7bcd3e62a3e3d0b784f56135493
          args:
            - --grpc-server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
            - --authentication-config=/etc/ateapi/authentication/authentication.yaml
            - --postgres-read-write-connection-string=@env
            - --postgres-owner-connection-string=@env
            - --postgres-read-write-role=@env
            - --postgres-owner-role=@env
            - --postgres-schema=@env
            - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
            - --actor-jwt-issuer=@env
            - --actor-id-ca-pool=/run/actor-id-ca-pool/pool.json
            - --atelet-client-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
            - --pod-identity-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
            - --default-egress-gateway-address=atenet-egress.ate-system.svc:443
            - --drain-delay=13s
            - --drain-timeout=15s
            - --snapshot-plugin-socket=/run/snapshot-plugin/control.sock
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: pg-agent-substrate-app
                  key: uri
            - name: ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING
              value: $(POSTGRES_URI)?sslmode=verify-full&sslrootcert=/run/postgres-server-ca/server-ca.pem
            - name: ATE_API_POSTGRES_OWNER_CONNECTION_STRING
              value: $(POSTGRES_URI)?sslmode=verify-full&sslrootcert=/run/postgres-server-ca/server-ca.pem
            - name: ATE_API_POSTGRES_READ_WRITE_ROLE
              value: substrate_readwrite
            - name: ATE_API_POSTGRES_OWNER_ROLE
              value: substrate_owner
            - name: ATE_API_POSTGRES_SCHEMA
              value: substrate
            - name: ATE_API_ACTOR_JWT_ISSUER
              value: https://api.ate-system.svc
          envFrom:
            - configMapRef:
                name: ate-otel-config
          volumeMounts:
            - name: snapshot-plugin
              mountPath: /run/snapshot-plugin
            - name: servicedns
              mountPath: /run/servicedns.podcert.ate.dev
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
            - name: actor-id-jwt-pool
              mountPath: /run/actor-id-jwt-pool
            - name: actor-id-ca-pool
              mountPath: /run/actor-id-ca-pool
              readOnly: true
            - name: authentication-config
              mountPath: /etc/ateapi/authentication
              readOnly: true
            - name: postgres-server-ca
              mountPath: /run/postgres-server-ca
              readOnly: true
          ports:
            - containerPort: 443
            - name: prometheus
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: snapshot-plugin
          emptyDir: {}
        - name: servicedns
          projected:
            sources:
              - podCertificate:
                  signerName: servicedns.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: podidentity.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
        - name: actor-id-jwt-pool
          projected:
            sources:
              - secret:
                  name: actor-id-jwt-pool
                  items:
                    - key: pool
                      path: pool.json
        - name: actor-id-ca-pool
          projected:
            sources:
              - secret:
                  name: actor-id-ca-pool
                  items:
                    - key: pool
                      path: pool.json
        - name: authentication-config
          configMap:
            name: ate-api-authentication
        - name: postgres-server-ca
          secret:
            secretName: pg-agent-substrate-ca
            items:
              - key: ca.crt
                path: server-ca.pem
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ate-api-server
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ate-system
spec:
  clusterIP: None
  ipFamilyPolicy: PreferDualStack
  selector:
    app: ate-api-server
  ports:
    - name: grpc
      protocol: TCP
      port: 443
      targetPort: 443
