apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-client
  namespace: ate-system
  labels:
    apps: ate-client
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ate-controller
  namespace: ate-system
  labels:
    apps: ate-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ate-controller
subjects:
  - kind: ServiceAccount
    name: ate-controller
    namespace: ate-system
roleRef:
  kind: ClusterRole
  name: ate-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ate-controller
  namespace: ate-system
subjects:
  - kind: ServiceAccount
    name: ate-controller
    namespace: ate-system
roleRef:
  kind: Role
  name: ate-controller
  apiGroup: rbac.authorization.k8s.io
---
kind: Service
apiVersion: v1
metadata:
  name: ate-controller
  namespace: ate-system
  labels:
    app: ate-controller
spec:
  selector:
    app: ate-controller
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ate-controller
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ate-controller
  template:
    metadata:
      labels:
        app: ate-controller
    spec:
      serviceAccountName: ate-controller
      containers:
        - name: ate-controller
          image: docker.io/nahsilabs/ate-controller:b73ee7f@sha256:915d7f9f894e62e7664bd0a4b72d151dc31f3b3f1dcecfdd41b99accda763b0e
          args:
            - --ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem
            - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
          envFrom:
            - configMapRef:
                name: ate-otel-config
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
            - name: servicedns-ca
              mountPath: /run/servicedns-ca
      volumes:
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ate-controller
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ate.dev
    resources:
      - workerpools
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ate.dev
    resources:
      - workerpools/finalizers
    verbs:
      - update
  - apiGroups:
      - ate.dev
    resources:
      - workerpools/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - certificates.k8s.io
    resources:
      - clustertrustbundles
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - certificates.k8s.io
    resourceNames:
      - egress-mitm.ate.dev/*
    resources:
      - signers
    verbs:
      - attest
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ate-controller
  namespace: ate-system
rules:
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - egress-mitm-ca-pool
    verbs:
      - get
      - list
      - watch
