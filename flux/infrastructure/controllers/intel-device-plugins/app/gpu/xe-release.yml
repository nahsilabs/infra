apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-gpu-xe
spec:
  interval: 1h
  values:
    name: intel-gpu-xe
    sharedDevNum: 1
    allowIDs: "0xe212"
    nodeFeatureRule: false
    enableMonitoring: true
    monitoringMode: single
    nodeSelector:
      gpu.intel.com/device-id.0300-e212.present: "true"
    tolerations: []
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.36.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
