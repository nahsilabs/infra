apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-gpu
spec:
  interval: 1h
  values:
    name: intel-gpu-i915
    sharedDevNum: 2
    allocationPolicy: balanced
    allowIDs: "0x46d0"
    nodeFeatureRule: true
    enableMonitoring: true
    monitoringMode: single
    nodeSelector:
      gpu.intel.com/device-id.0300-46d0.present: "true"
    tolerations: []
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.37.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
