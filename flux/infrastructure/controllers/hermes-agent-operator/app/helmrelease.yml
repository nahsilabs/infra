apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: hermes-agent-operator
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    manager:
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 512Mi
