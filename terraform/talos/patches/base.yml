machine:
  nodeLabels:
    cilium-bgp: true

  certSANs:
    - talos.nahsi.dev

  install:
    diskSelector:
      size: '>= 50GB'
    bootloader: true
    wipe: true

  time:
    servers:
      - time.cloudflare.com

  kubelet:
    extraArgs:
      rotate-server-certificates: true

cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: none
  proxy:
    disabled: true

  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
      
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 10.2.15.2
