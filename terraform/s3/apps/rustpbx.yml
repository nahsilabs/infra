acl: private
force_destroy: false
cors_rules:
  - allowed_origins:
      - https://rustpbx.nahsi.dev
    allowed_methods: [GET, HEAD]
    allowed_headers: ["*"]
    expose_headers: [Accept-Ranges, Content-Range, Content-Encoding, Content-Length, ETag]
    max_age_seconds: 3600
lifecycle_rules:
  - id: expire-recordings
    prefix: recordings/
    expiration_days: 30
